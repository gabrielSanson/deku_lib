<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sem conexão</title>
		<style>
			body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #fafaf9; color: #1c1917; text-align: center; padding: 16px; }
			button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 0; background: #ffbc00; color: #000; font-weight: 700; }
			@media (prefers-color-scheme: dark) { body { background: #0c0a09; color: #fafaf9; } }
		</style>
	</head>
	<body>
		<main>
			<h1>Sem conexão</h1>
			<p>Verifique a internet. Pedidos e preços só aparecem com conexão, para nunca mostrar algo desatualizado.</p>
			<button onclick="location.reload()">Tentar de novo</button>
		</main>
	</body>
</html>
